name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Shared preamble sync check
        run: python3 scripts/sync-shared.py --check
      - name: Frontmatter / portability lint
        run: python3 scripts/check-frontmatter.py
      - name: Agent Skills spec validation
        run: |
          for d in skills/*/; do
            npx --yes skills-ref validate "$d"
          done
      - name: Claude Code plugin validation (strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
